name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive  # Blowfish（submodule）を取得

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"  # Blowfish v3.6.0 動作保証の最終バージョン
          extended: true  # Blowfish は extended 版が必須

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Verify search index
        # index.json の permalink が絶対URL（https://）かを確認する
        # layouts/_default/index.json で .Permalink を使っているが、
        # テーマ更新で .RelPermalink（相対URL）に戻ると検索結果クリックで 404 になるため
        # jq -e: 評価結果が false/null のとき終了コード 1（CI 失敗）
        # all(.[]; ...): 配列の全要素が条件を満たすか確認
        run: jq -e 'all(.[]; .permalink | startswith("https://"))' public/index.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

# GitHub Pages の公開URL（Actions がビルド時に上書きするのでローカル用の目安）
baseURL = "https://watakarinto.github.io/apple-events-summary/"

# ブラウザタブ・ヘッダー・RSS タイトルに出る
title = "Apple Events Summary"

# 使用テーマ（themes/blowfish/ を参照）
theme = "blowfish"

# Blowfish の言語設定（languages.en.toml に対応。"ja"にすると多言語モードになり検索が壊れる）
defaultContentLanguage = "en"

# 記事内で絵文字を使えるようにする
enableEmoji = true

# タクソノミー（タグ等）の先頭を自動で大文字にしない（iPhoneがIPhoneになるのを防ぐ）
capitalizeListTitles = false

# /images/... をbaseURL込みの絶対URLに変換（GitHub Pagesのサブディレクトリ対応）
canonifyURLs = true

# 検索インデックス用（Blowfish の enableSearch に必要）
[outputs]
  home = ["HTML", "RSS", "JSON"]

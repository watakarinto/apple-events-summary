# カラースキームのベース（実際の色上書きは assets/css/custom.css で行っている）
colorScheme = "apple"

enableSearch = true

# トップページに表示するセクション（これがないと記事が表示されない）
mainSections = ["posts"]

# デフォルトはライトモード
defaultAppearance = "light"

# OS のダークモード設定に自動で追従する
autoSwitchAppearance = true

[footer]
  showThemeAttribution = false

[header]
  # fixed = スクロールしてもヘッダーが上部に固定される
  layout = "fixed"

[homepage]
  # card = 記事をカード形式で並べるレイアウト
  layout = "card"
  showRecent = true
  # トップページに表示する最新記事数
  showRecentItems = 10

[article]
  # 記事の公開日を表示する
  showDate = true
  # 読了時間は不要なので非表示
  showReadingTime = false
  # 目次は不要なので非表示
  showTableOfContents = true
  # タグ・カテゴリを表示する
  showTaxonomies = true
  showTags = true
